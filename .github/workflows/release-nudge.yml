# When a setup release is published, open one assigned issue telling every machine
# to pull the new version. Event-driven; no polling.
name: release-nudge

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Announce the release to every machine
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          TAG="$TAG" .github/scripts/announce_setup_release.sh
