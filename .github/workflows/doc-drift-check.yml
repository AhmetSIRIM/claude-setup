# Weekly: read the current Claude Code docs and check this setup against them.
# Opens one issue per run when drift is found, assigned to the repository owner.
#
# Provider: OpenCode Go plan, via the opencode CLI. A spent monthly limit marks the
# review job skipped instead of failing the run.
# Needs OPENCODE_GO_KEY as a repository secret: an API key from the OpenCode console.
# One key serves both the Zen and the Go provider.
name: doc-drift-check

on:
  schedule:
    - cron: "0 0 * * 1"   # Mondays 03:00 Europe/Istanbul, the same moment as every Dependabot run
  workflow_dispatch:

env:
  OPENCODE_MODEL: opencode-go/gpt-5.6-luna

permissions:
  contents: read
  issues: write

# A manual run and the cron firing together would both collect prior issues before
# either opens one, producing duplicate digests. Queueing them serializes that read.
concurrency:
  group: doc-drift-check

jobs:
  # The budget probe is its own job because a step cannot mark its own job skipped:
  # a step can only fail the job or make later steps skip while the job stays green.
  # Only a job-level `if:` yields the grey "skipped" state, so `check` keys off this
  # job's output.
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.budget.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false   # no module dependencies, nothing to cache

      # Reads the plan's usage windows: a rate-limited window skips the review,
      # anything else wrong with the plan or the key fails here with the API's answer.
      - name: Check the Go plan budget
        id: budget
        env:
          OPENCODE_GO_KEY: ${{ secrets.OPENCODE_GO_KEY }}
        run: go run ./cmd/budget-check

  check:
    needs: budget
    if: needs.budget.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install opencode
        run: .github/scripts/install_opencode.sh

      - name: Write opencode credentials from the repository secret
        env:
          OPENCODE_GO_KEY: ${{ secrets.OPENCODE_GO_KEY }}
        run: |
          set -euo pipefail
          python3 .github/scripts/write_opencode_auth.py
          opencode auth list

      - name: Collect prior drift findings
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/collect_prior_issues.sh

      - name: Fetch Claude Code docs
        if: steps.prior.outputs.skip != 'true'
        run: .github/scripts/fetch_docs.sh

      - name: Build the review prompt
        if: steps.prior.outputs.skip != 'true'
        run: |
          python3 .github/scripts/build_prompt.py > /tmp/prompt.txt
          wc -c /tmp/prompt.txt; cat /tmp/digest-meta.env

      - name: Ask the model
        if: steps.prior.outputs.skip != 'true'
        id: review
        run: .github/scripts/ask_model.sh

      - name: Open assigned issue when drift is found
        if: steps.prior.outputs.skip != 'true' && steps.review.outputs.drift == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          OPENCODE_MODEL: ${{ env.OPENCODE_MODEL }}
          LATEST_VERSION: ${{ steps.review.outputs.LATEST_VERSION }}
        with:
          script: |
            const open = require('./.github/scripts/open_drift_issue.js');
            await open({ github, context, core });
